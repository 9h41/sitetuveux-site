name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_domain: ${{ steps.env.outputs.site_domain }}
      cname: ${{ steps.env.outputs.cname }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "site_domain=https://stg.sitetuveux.com" >> "$GITHUB_OUTPUT"
            echo "cname=stg.sitetuveux.com" >> "$GITHUB_OUTPUT"
            echo "site_env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "site_domain=https://sitetuveux.com" >> "$GITHUB_OUTPUT"
            echo "cname=sitetuveux.com" >> "$GITHUB_OUTPUT"
            echo "site_env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        env:
          SITE_DOMAIN: ${{ steps.env.outputs.site_domain }}
          SITE_ENV: ${{ steps.env.outputs.site_env }}
        run: npm run build

      - name: Set custom domain for deployment
        run: echo "${{ steps.env.outputs.cname }}" > _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
